<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🌴 Tentation Island</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button onclick="location.href='index.html'">🔙 Torna alla home</button>
  <h2>🌴 Tentation Island</h2>
  <p>Crea una situazione divertente o imbarazzante da Tentation Island!</p>
  <button onclick="generateScenario()">Genera Scenario</button>
  <p id="scenario" style="margin-top: 20px; font-size: 1.3em; min-height: 70px;"></p>

  <script>
    const scenarios = [
      "Il tuo fidanzato/a flirta con un/una single davanti a te.",
      "Scopri un messaggio segreto sul cellulare del partner.",
      "Uno dei single ti manda un messaggio misterioso.",
      "Il partner deve scegliere tra te e una tentazione molto attraente.",
      "Una festa in spiaggia con balli e sguardi complici."
    ];

    function generateScenario() {
      const randomIndex = Math.floor(Math.random() * scenarios.length);
      document.getElementById('scenario').innerText = scenarios[randomIndex];
    }
  </script>
</body>
</html>
