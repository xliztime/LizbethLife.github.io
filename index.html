<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>That Girl Space Shooter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

    body {
      margin: 0;
      background: linear-gradient(135deg, #fceff9 0%, #f9f5f0 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #d48ca3;
      user-select: none;
    }

    h1 {
      margin-top: 20px;
      font-weight: 700;
      font-size: 2rem;
      font-family: 'Poppins', sans-serif;
    }

    #gameCanvas {
      background: #fffafc;
      border: 3px solid #f3dfe5;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(212, 140, 163, 0.4);
      display: block;
      margin: 20px auto;
      touch-action: none;
    }

    .instructions {
      font-style: italic;
      color: #b77e9b;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>✨ That Girl Space Shooter ✨</h1>
  <p class="instructions">Usa le frecce ← → per muoverti, spazio per sparare!</p>
  <canvas id="gameCanvas" width="600" height="500"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 70,
      width: 40,
      height: 60,
      speed: 7,
      movingLeft: false,
      movingRight: false,
      bullets: [],
      cooldown: 0,
    };

    const enemies = [];
    let enemySpawnInterval = 100; // frames
    let frameCount = 0;
    let score = 0;
    let gameOver = false;

    // Disegno astronave giocatore professionale (stile minimal ma elegante)
    function drawPlayer() {
      // Base
      ctx.fillStyle = '#d48ca3';
      ctx.beginPath();
      ctx.moveTo(player.x + player.width/2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // Finestrino
      ctx.fillStyle = '#f9c2d4';
      ctx.beginPath();
      ctx.ellipse(player.x + player.width/2, player.y + player.height/3, 8, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Luci laterali
      ctx.fillStyle = '#f3a4c6';
      ctx.beginPath();
      ctx.arc(player.x + 5, player.y + player.height - 15, 5, 0, Math.PI * 2);
      ctx.arc(player.x + player.width - 5, player.y + player.height - 15, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Nemico semplice ma stiloso
    function drawEnemy(enemy) {
      ctx.fillStyle = '#b6a2c7';
      ctx.beginPath();
      ctx.ellipse(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.width/2, enemy.height/2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d7b5d9';
      ctx.beginPath();
      ctx.moveTo(enemy.x + enemy.width * 0.2, enemy.y + enemy.height * 0.4);
      ctx.lineTo(enemy.x + enemy.width * 0.8, enemy.y + enemy.height * 0.4);
      ctx.lineTo(enemy.x + enemy.width * 0.5, enemy.y + enemy.height * 0.9);
      ctx.closePath();
      ctx.fill();
    }

    // Disegna proiettile
    function drawBullet(bullet) {
      ctx.fillStyle = '#f3a4c6';
      ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
    }

    // Aggiorna e disegna tutto
    function update() {
      if(gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Movimento giocatore
      if(player.movingLeft && player.x > 0) player.x -= player.speed;
      if(player.movingRight && player.x + player.width < canvas.width) player.x += player.speed;

      // Gestione spari cooldown
      if(player.cooldown > 0) player.cooldown--;

      // Disegna giocatore
      drawPlayer();

      // Aggiorna e disegna proiettili
      for(let i = player.bullets.length - 1; i >= 0; i--) {
        let b = player.bullets[i];
        b.y -= b.speed;
        if(b.y + b.height < 0) player.bullets.splice(i, 1);
        else drawBullet(b);
      }

      // Spawn nemici a intervalli regolari
      if(frameCount % enemySpawnInterval === 0) {
        let size = 40;
        let x = Math.random() * (canvas.width - size);
        enemies.push({x: x, y: -size, width: size, height: size, speed: 2});
      }

      // Aggiorna nemici
      for(let i = enemies.length -1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;

        // Controllo collisioni con proiettili
        for(let j = player.bullets.length -1; j >= 0; j--) {
          let b = player.bullets[j];
          if(b.x < e.x + e.width &&
             b.x + b.width > e.x &&
             b.y < e.y + e.height &&
             b.y + b.height > e.y) {
            // colpito
            enemies.splice(i,1);
            player.bullets.splice(j,1);
            score += 10;
            break;
          }
        }

        // Controllo collisione con giocatore = game over
        if(e.x < player.x + player.width &&
           e.x + e.width > player.x &&
           e.y < player.y + player.height &&
           e.y + e.height > player.y) {
          gameOver = true;
          setTimeout(() => alert("Game Over! Il tuo punteggio: " + score), 100);
        }

        if(e.y > canvas.height) enemies.splice(i,1);
        else drawEnemy(e);
      }

      // Mostra punteggio
      ctx.fillStyle = '#d48ca3';
      ctx.font = '20px Poppins';
      ctx.fillText('Punteggio: ' + score, 10, 30);

      frameCount++;
      requestAnimationFrame(update);
    }

    // Controlli tastiera
    document.addEventListener('keydown', e => {
      if(e.code === 'ArrowLeft') player.movingLeft = true;
      if(e.code === 'ArrowRight') player.movingRight = true;
      if(e.code === 'Space') {
        if(player.cooldown === 0) {
          // Spara
          player.bullets.push({x: player.x + player.width/2 - 3, y: player.y - 10, width: 6, height: 12, speed: 10});
          player.cooldown = 15; // ritardo tra i colpi
        }
      }
    });

    document.addEventListener('keyup', e => {
      if(e.code === 'ArrowLeft') player.movingLeft = false;
      if(e.code === 'ArrowRight') player.movingRight = false;
    });

    update();
  </script>
</body>
</html>
