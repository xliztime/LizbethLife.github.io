<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🐍 Snake Game</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    canvas {
      background-color: #fff0f6;
      display: block;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(252, 81, 133, 0.4);
    }
    button.back-btn {
      background-color: #ffb6c1;
      border-radius: 10px;
      padding: 10px 20px;
      margin: 20px auto;
      display: block;
      font-size: 1.1em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button.back-btn:hover {
      background-color: #ffa3b4;
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="location.href='index.html'">🔙 Torna alla home</button>
  <canvas id="game" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    let count = 0;
    let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
    let apple = { x: 320, y: 320 };
    let speed = 6;

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function loop() {
      requestAnimationFrame(loop);
      if (++count < speed) return;
      count = 0;

      snake.x += snake.dx;
      snake.y += snake.dy;

      if (snake.x < 0) snake.x = canvas.width - grid;
      else if (snake.x >= canvas.width) snake.x = 0;
      if (snake.y < 0) snake.y = canvas.height - grid;
      else if (snake.y >= canvas.height) snake.y = 0;

      snake.cells.unshift({ x: snake.x, y: snake.y });

      if (snake.cells.length > snake.maxCells) snake.cells.pop();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw apple
      ctx.fillStyle = '#fc5185';
      ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

      // Draw snake
      ctx.fillStyle = '#3f2b36';
      snake.cells.forEach((cell, index) => {
        ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

        // Snake eats apple
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          apple.x = getRandomInt(0, canvas.width / grid) * grid;
          apple.y = getRandomInt(0, canvas.height / grid) * grid;
          if (speed > 2) speed--;
        }

        // Snake collides with self -> reset
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            snake.x = 160;
            snake.y = 160;
            snake.cells = [];
            snake.maxCells = 4;
            snake.dx = grid;
            snake.dy = 0;
            apple.x = getRandomInt(0, canvas.width / grid) * grid;
            apple.y = getRandomInt(0, canvas.height / grid) * grid;
            speed = 6;
          }
        }
      });
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
      else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
      else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
      else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
