<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎉 Tombola 90</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button onclick="location.href='index.html'">🔙 Torna alla home</button>
  <h2>🎉 Tombola 90</h2>
  <button onclick="drawNumber()">Estrai Numero</button>
  <button onclick="resetGame()" style="margin-left: 10px;">Reset</button>
  <p id="number" style="font-size: 2em; margin-top: 20px; height: 60px;"></p>
  <div id="history" style="margin-top: 15px; max-width: 400px; word-wrap: break-word;"></div>

  <script>
    let numbers = Array.from({length: 90}, (_, i) => i + 1);
    let extracted = [];

    function drawNumber() {
      if (numbers.length === 0) {
        alert("Hai estratto tutti i numeri!");
        return;
      }
      const index = Math.floor(Math.random() * numbers.length);
      const num = numbers.splice(index, 1)[0];
      extracted.push(num);
      document.getElementById('number').innerText = num;
      document.getElementById('history').innerText = "Numeri estratti: " + extracted.join(", ");
    }

    function resetGame() {
      numbers = Array.from({length: 90}, (_, i) => i + 1);
      extracted = [];
      document.getElementById('number').innerText = "";
      document.getElementById('history').innerText = "";
    }
  </script>
</body>
</html>
