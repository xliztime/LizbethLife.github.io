<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>😈 Obbligo o Verità</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button onclick="location.href='index.html'">🔙 Torna alla home</button>
  <h2>😈 Obbligo o Verità</h2>
  <div id="output" style="margin:20px 0; font-size:1.2em; min-height: 50px;"></div>
  <button onclick="generate('truth')">Verità</button>
  <button onclick="generate('dare')">Obbligo</button>

  <script>
    const truths = [
      "Qual è il tuo più grande segreto?",
      "Hai mai mentito a un amico?",
      "Chi ti piace davvero?",
      "Qual è la tua paura più grande?",
      "Racconta la cosa più imbarazzante che ti è successa."
    ];
    const dares = [
      "Fai 10 flessioni",
      "Canta una canzone a caso",
      "Invia un messaggio d'amore a qualcuno ora!",
      "Balla per 30 secondi",
      "Fai una smorfia buffa per 10 secondi"
    ];

    function generate(type) {
      const data = type === 'truth' ? truths : dares;
      const randomIndex = Math.floor(Math.random() * data.length);
      document.getElementById('output').innerText = data[randomIndex];
    }
  </script>
</body>
</html>
